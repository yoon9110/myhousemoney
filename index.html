<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 가계부</title>
<style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4fbf4; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { color: #2e7d32; text-align: center; font-size: 24px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #4caf50; font-size: 14px;}
    input, select { width: 100%; padding: 10px; border: 1px solid #c8e6c9; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
    button { background-color: #4caf50; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
    button:hover { background-color: #388e3c; }
    .excel-btn { background-color: #2e7d32; margin-bottom: 25px; }
    #app-screen { display: none; }
</style>
<!-- 파이어베이스 연결 도구 -->
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="container">
    <h1>우리집 가계부</h1>

    <!-- 1. 로그인 화면 -->
    <div id="login-screen">
        <p style="text-align: center; color: #666; font-size: 14px;">가족 공용 암호를 입력해 주세요.</p>
        <input type="email" id="email" value="family@myhouse.com" style="margin-bottom: 10px; background-color: #eee;" readonly>
        <input type="password" id="pw" placeholder="비밀번호">
        <button onclick="login()">열쇠로 열기</button>
    </div>

    <!-- 2. 가계부 화면 -->
    <div id="app-screen">
        <button class="excel-btn" onclick="exportExcel()">엑셀로 저장하기</button>
        <button onclick="resetList()" style="width: 100%; padding: 12px; margin-top: 10px; background-color: #d32f2f; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">결제 내역 전체 삭제</button>
        
        <div class="form-group" style="margin-top: 15px;">
            <label>날짜</label>
            <input type="date" id="date">
        </div>
        <div class="form-group">
            <label>결제처</label>
            <input type="text" id="merchant" placeholder="예: 네이버페이">
        </div>
        <div class="form-group">
            <label>금액</label>
            <input type="number" id="amount" placeholder="예: 25000">
        </div>
        <div class="form-group">
            <label>항목</label>
            <input type="text" id="category" placeholder="예: 식비, 주유비, 생활용품 등">
        </div>

        <div style="display: flex; gap: 10px;">
            <button id="saveBtn" onclick="saveData()">결제 입력하기</button>
            <button id="cancelEditBtn" onclick="cancelEdit()" style="display: none; background-color: #9e9e9e;">수정 취소</button>
        </div>

        <!-- 월별 보기 필터 추가 -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 30px; border-bottom: 2px solid #c8e6c9; padding-bottom: 10px;">
            <h2 style="color: #2e7d32; margin: 0; font-size: 18px;">결제 목록 요약</h2>
            <div style="display: flex; gap: 5px; align-items: center;">
                <input type="month" id="filter-month" onchange="renderList()" style="width: auto; padding: 5px; font-size: 14px; margin: 0; border: 1px solid #a5d6a7;">
                <button onclick="document.getElementById('filter-month').value=''; renderList();" style="width: auto; padding: 6px 10px; margin: 0; background-color: #757575; font-size: 12px;">전체</button>
            </div>
        </div>
        
        <div id="summary-box" style="background-color: #e8f5e9; padding: 15px; border-radius: 8px; margin-top: 15px; margin-bottom: 15px;"></div>

        <div id="payment-list"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDDIfxfay3hphtjDCkR6tR5fH_ubup6BsY",
        authDomain: "myhousemoney-14c01.firebaseapp.com",
        projectId: "myhousemoney-14c01",
        storageBucket: "myhousemoney-14c01.firebasestorage.app",
        messagingSenderId: "208634328082",
        appId: "1:208634328082:web:a793e5d3fdd6838e1994cb"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let editingId = null;
    let allPayments = []; // 모든 결제 내역을 저장해두는 공간

    // 오늘 날짜 및 이번 달 기본 세팅
    const today = new Date();
    document.getElementById('date').value = today.toISOString().substring(0, 10);
    document.getElementById('filter-month').value = today.toISOString().substring(0, 7);

    function login() {
        const email = document.getElementById('email').value;
        const pw = document.getElementById('pw').value;
        auth.signInWithEmailAndPassword(email, pw)
            .then(() => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
            })
            .catch((error) => {
                alert("비밀번호가 틀렸거나 아직 등록되지 않았습니다!");
            });
    }

    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
        }
    });

    function editData(id, date, merchant, amount, category) {
        editingId = id;
        document.getElementById('date').value = date;
        document.getElementById('merchant').value = merchant;
        document.getElementById('amount').value = amount;
        document.getElementById('category').value = category;

        document.getElementById('saveBtn').innerText = "수정 완료하기";
        document.getElementById('saveBtn').style.backgroundColor = "#f57c00";
        document.getElementById('cancelEditBtn').style.display = "block";
        
        window.scrollTo(0, 0);
    }

    function cancelEdit() {
        editingId = null;
        document.getElementById('saveBtn').innerText = "결제 입력하기";
        document.getElementById('saveBtn').style.backgroundColor = "#4caf50";
        document.getElementById('cancelEditBtn').style.display = "none";
        
        document.getElementById('merchant').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('category').value = '';
        document.getElementById('date').value = new Date().toISOString().substring(0, 10);
    }

    async function saveData() {
        const date = document.getElementById('date').value;
        const merchant = document.getElementById('merchant').value;
        const amount = document.getElementById('amount').value;
        const category = document.getElementById('category').value;

        if(!merchant || !amount) {
            alert("결제처와 금액을 적어주세요!");
            return;
        }

        try {
            if (editingId) {
                await db.collection("가계부결제내역").doc(editingId).update({
                    date: date,
                    merchant: merchant,
                    amount: Number(amount),
                    category: category
                });
                alert("성공적으로 수정되었습니다!");
                cancelEdit();
            } else {
                await db.collection("가계부결제내역").add({
                    date: date,
                    merchant: merchant,
                    amount: Number(amount),
                    category: category,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("저장되었습니다!");
                document.getElementById('merchant').value = '';
                document.getElementById('amount').value = '';
                document.getElementById('category').value = '';
            }
        } catch (error) {
            alert("처리 실패! " + error.message);
        }
    }

    async function exportExcel() {
        try {
            const querySnapshot = await db.collection("가계부결제내역").orderBy("date", "desc").get();
            let csv = '날짜,결제처,금액,항목\n';
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                csv += `${data.date},${data.merchant},${data.amount},${data.category}\n`;
            });
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "우리집_가계부.csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        } catch (error) {
            alert("저장 권한이 없거나 오류가 발생했습니다.");
        }
    }

    // 서버에서 전체 데이터를 불러온 뒤 저장해두기
    db.collection("가계부결제내역").orderBy("date", "desc").onSnapshot((querySnapshot) => {
        allPayments = [];
        querySnapshot.forEach((doc) => {
            allPayments.push({ id: doc.id, ...doc.data() });
        });
        renderList(); // 데이터 갱신 시 화면 다시 그리기
    });

    // 선택한 월에 맞춰 리스트와 통계 그리기
    function renderList() {
        const listContainer = document.getElementById("payment-list");
        const summaryBox = document.getElementById("summary-box");
        const filterMonth = document.getElementById("filter-month").value; // 예: "2026-10"
        
        if (!listContainer || !summaryBox) return;
        
        listContainer.innerHTML = "";
        let totalAmount = 0;
        let categorySums = {};
        
        allPayments.forEach((data) => {
            // 선택한 월(예: 2026-10)이 있고, 결제 날짜가 해당 월로 시작하지 않으면 패스
            if (filterMonth && !data.date.startsWith(filterMonth)) {
                return;
            }

            const amountNum = Number(data.amount) || 0;
            const catName = data.category || '기타';
            
            // 통계 합산
            totalAmount += amountNum;
            if (categorySums[catName]) {
                categorySums[catName] += amountNum;
            } else {
                categorySums[catName] = amountNum;
            }

            // 목록 HTML 생성
            const listItem = document.createElement("div");
            listItem.style = "padding: 12px; border-bottom: 1px solid #e0e0e0; margin-bottom: 8px; background: #fafafa; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;";
            const amountStr = amountNum.toLocaleString();
            
            listItem.innerHTML = `
                <div>
                    <div style="font-size: 0.85em; color: #888; margin-bottom: 4px;">${data.date}</div>
                    <div style="font-size: 1.05em; margin-bottom: 4px;">
                        <strong>${data.merchant}</strong> - <strong style="color: #2e7d32;">${amountStr}원</strong>
                    </div>
                    <div style="font-size: 0.9em; color: #555;">[항목] ${catName}</div>
                </div>
                <div style="display: flex; gap: 5px;">
                    <button onclick="editData('${data.id}', '${data.date}', \`${data.merchant}\`, ${amountNum}, \`${catName}\`)" style="width: auto; padding: 6px 12px; background-color: #f57c00; font-size: 12px; margin-top: 0; color: white; border: none; border-radius: 4px;">수정</button>
                    <button onclick="deleteSingleData('${data.id}')" style="width: auto; padding: 6px 12px; background-color: #d32f2f; font-size: 12px; margin-top: 0; color: white; border: none; border-radius: 4px;">삭제</button>
                </div>
            `;
            listContainer.appendChild(listItem);
        });

        // 통계 박스 HTML 생성
        const displayMonth = filterMonth ? filterMonth.split('-')[1] + '월' : '전체';
        let summaryHTML = `<div style="font-size: 1.2em; font-weight: bold; color: #1b5e20; margin-bottom: 10px;">${displayMonth} 총 결제금액: ${totalAmount.toLocaleString()}원</div>`;
        summaryHTML += `<div style="display: flex; flex-wrap: wrap; gap: 8px;">`;
        
        for (const [cat, sum] of Object.entries(categorySums)) {
            summaryHTML += `<span style="background: #ffffff; padding: 5px 10px; border-radius: 15px; border: 1px solid #a5d6a7; font-size: 0.9em; color: #2e7d32;">${cat}: <strong>${sum.toLocaleString()}원</strong></span>`;
        }
        summaryHTML += `</div>`;
        
        summaryBox.innerHTML = summaryHTML;
    }

    async function deleteSingleData(id) {
        if (confirm("이 내역을 삭제하시겠습니까?")) {
            try {
                await db.collection("가계부결제내역").doc(id).delete();
            } catch (error) {
                alert("삭제 중 오류가 발생했습니다.");
            }
        }
    }

    async function resetList() {
        if (confirm("정말로 모든 결제 내역을 지우시겠습니까? 이 작업은 되돌릴 수 없습니다.")) {
            try {
                const querySnapshot = await db.collection("가계부결제내역").get();
                querySnapshot.forEach((doc) => {
                    db.collection("가계부결제내역").doc(doc.id).delete();
                });
                alert("모든 내역이 깨끗하게 지워졌습니다.");
            } catch (error) {
                alert("삭제 권한이 없거나 오류가 발생했습니다.");
            }
        }
    }
</script>
</body>
</html>
