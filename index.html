<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 가계부 & 자산</title>
<style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4fbf4; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { color: #2e7d32; text-align: center; font-size: 24px; margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #4caf50; font-size: 14px;}
    input, select { width: 100%; padding: 10px; border: 1px solid #c8e6c9; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
    button { color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.2s; }
    button:hover { opacity: 0.9; }
    .excel-btn { background-color: #2e7d32; margin-bottom: 25px; }
    #app-screen { display: none; }
    
    /* 탭 메뉴 */
    .tab-container { display: flex; margin-bottom: 25px; border-radius: 8px; overflow: hidden; border: 2px solid #2e7d32; }
    .tab-btn { margin: 0; border-radius: 0; width: 33.33%; font-size: 15px; padding: 12px 0; }

    /* 달력 관련 디자인 (더보기 기능 유지) */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .calendar-day-header { text-align: center; font-weight: bold; background: #e8f5e9; padding: 8px 0; border-radius: 4px; font-size: 13px; color: #2e7d32; }
    .calendar-cell { min-height: 105px; border: 1px solid #c8e6c9; border-radius: 4px; padding: 4px; display: flex; flex-direction: column; background: white; }
    .calendar-cell.empty { background: #f9f9f9; border: 1px dashed #e0e0e0; }
    .calendar-date { font-weight: bold; font-size: 13px; margin-bottom: 4px; color: #555; }
    .calendar-item { padding: 4px; border-radius: 4px; margin-bottom: 3px; font-size: 10px; line-height: 1.2; overflow: hidden; word-break: break-all; }
    .cal-income { background: #e3f2fd; color: #1565c0; border-left: 2px solid #1976d2; }
    .cal-expense { background: #ffebee; color: #c62828; border-left: 2px solid #d32f2f; }
    .cal-transfer { background: #eeeeee; color: #616161; border-left: 2px solid #9e9e9e; }
    .sunday { color: #d32f2f !important; }
    .saturday { color: #1976d2 !important; }
    
    /* 더보기 버튼 디자인 */
    .view-more-btn { 
        text-align: center; font-size: 11px; font-weight: bold; color: #2e7d32; 
        cursor: pointer; padding: 4px 0; margin-top: auto; 
        background: #e8f5e9; border-radius: 4px; border: 1px solid #c8e6c9; 
    }
    .view-more-btn:hover { background: #c8e6c9; }
</style>
<!-- 파이어베이스 연결 도구 -->
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="container">
    <h1>우리집 가계부 🏡</h1>

    <!-- 1. 로그인 화면 -->
    <div id="login-screen">
        <p style="text-align: center; color: #666; font-size: 14px;">가족 공용 암호를 입력해 주세요.</p>
        <input type="email" id="email" value="family@myhouse.com" style="margin-bottom: 10px; background-color: #eee;" readonly>
        <input type="password" id="pw" placeholder="비밀번호">
        <button onclick="login()" style="background-color: #4caf50;">열쇠로 열기</button>
    </div>

    <!-- 2. 메인 앱 화면 -->
    <div id="app-screen">
        
        <!-- 탭 네비게이션 -->
        <div class="tab-container">
            <button id="btn-ledger" class="tab-btn" onclick="showSection('ledger')" style="background-color: #2e7d32; color: white;">📝 가계부</button>
            <button id="btn-calendar" class="tab-btn" onclick="showSection('calendar')" style="background-color: #e8f5e9; color: #2e7d32;">📅 달력</button>
            <button id="btn-asset" class="tab-btn" onclick="showSection('asset')" style="background-color: #e8f5e9; color: #2e7d32;">🏦 자산</button>
        </div>

        <!-- ================= [가계부 섹션] ================= -->
        <div id="ledger-section">
            <button class="excel-btn" onclick="exportExcel()">엑셀로 저장하기</button>
            
            <div style="background-color: #e3f2fd; padding: 15px; border-radius: 8px; margin-top: 25px; margin-bottom: 25px; border: 1px solid #90caf9;">
                <h3 style="margin-top: 0; color: #1565c0; font-size: 16px; margin-bottom: 15px;">🔄 자산 이체 (카드 대금 결제)</h3>
                <div id="favorite-routes-container" style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px;"></div>
                <div style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
                    <select id="transfer-from" style="flex: 1; font-size: 13px;"><option value="">출금 자산 선택</option></select>
                    <span style="color: #1565c0; font-weight: bold;">➡</span>
                    <select id="transfer-to" style="flex: 1; font-size: 13px;"><option value="">입금 자산 선택</option></select>
                </div>
                <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                    <input type="number" id="transfer-amount" placeholder="이체 금액 (예: 200000)" style="flex: 1; border: 1px solid #90caf9;">
                    <button onclick="saveFavoriteRoute()" style="flex: 1; background-color: #64b5f6; margin-top: 0; padding: 10px; font-size: 13px;">⭐ 현재 구간 저장</button>
                </div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="transfer-memo" placeholder="이체 메모 (예: 매달 적금)" style="flex: 2; border: 1px solid #90caf9;">
                    <button onclick="transferAsset()" style="flex: 1; background-color: #1565c0; margin-top: 0; padding: 10px; font-size: 14px;">이체 실행</button>
                </div>
            </div>

            <div style="background-color: #f1f8e9; padding: 15px; border-radius: 8px; border: 1px solid #c5e1a5; margin-bottom: 25px;">
                <h3 style="margin-top: 0; color: #33691e; font-size: 16px; margin-bottom: 15px;">💸 수입 / 지출 입력</h3>
                <div class="form-group">
                    <label>날짜</label>
                    <input type="date" id="date">
                </div>
                <div class="form-group" style="background: #e8f5e9; padding: 10px; border-radius: 5px;">
                    <label style="color: #1b5e20;">🔗 연결 자산 (어디로 들어오고 나가나요?)</label>
                    <select id="linked-asset" style="border: 1px solid #a5d6a7;">
                        <option value="">선택 안 함 (가계부 내역만 기록)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>결제처</label>
                    <input type="text" id="merchant" placeholder="예: 네이버페이, 월급 통장">
                </div>
                <div class="form-group">
                    <label>금액</label>
                    <input type="number" id="amount" placeholder="예: 25000">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>항목</label>
                    <input type="text" id="category" placeholder="예: 식비, 주유비, 월급 등">
                </div>
                
                <div id="input-buttons" style="display: flex; gap: 10px;">
                    <button onclick="saveData('expense')" style="flex: 1; background-color: #d32f2f;">지출 입력</button>
                    <button onclick="saveData('income')" style="flex: 1; background-color: #1976d2;">수입 입력</button>
                </div>
                <div id="edit-buttons" style="display: none; gap: 10px;">
                    <button onclick="saveData('expense')" style="flex: 1; background-color: #d32f2f;">지출로 수정</button>
                    <button onclick="saveData('income')" style="flex: 1; background-color: #1976d2;">수입으로 수정</button>
                    <button onclick="cancelEdit()" style="flex: 1; background-color: #9e9e9e;">취소</button>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #c8e6c9; padding-bottom: 10px;">
                <h2 style="color: #2e7d32; margin: 0; font-size: 18px;">결제 목록 요약</h2>
                <div style="display: flex; gap: 5px; align-items: center;">
                    <input type="month" id="filter-month" onchange="currentCategoryFilter=null; renderList();" style="width: auto; padding: 5px; font-size: 14px; margin: 0; border: 1px solid #a5d6a7;">
                    <button onclick="document.getElementById('filter-month').value=''; currentCategoryFilter=null; renderList();" style="width: auto; padding: 6px 10px; margin: 0; background-color: #757575; font-size: 12px;">전체</button>
                </div>
            </div>
            
            <div id="summary-box" style="background-color: #e8f5e9; padding: 15px; border-radius: 8px; margin-top: 15px; margin-bottom: 15px;"></div>
            <div id="payment-list"></div>
        </div>

        <!-- ================= [지출 달력 섹션] ================= -->
        <div id="calendar-section" style="display: none;">
            <div class="calendar-header">
                <button onclick="changeCalendarMonth(-1)" style="width: auto; padding: 8px 15px; background: #4caf50;">◀ 이전 달</button>
                <h2 id="calendar-month-title" style="margin: 0; color: #2e7d32; font-size: 20px;">2026년 11월</h2>
                <button onclick="changeCalendarMonth(1)" style="width: auto; padding: 8px 15px; background: #4caf50;">다음 달 ▶</button>
            </div>
            
            <div class="calendar-grid">
                <div class="calendar-day-header sunday">일</div>
                <div class="calendar-day-header">월</div>
                <div class="calendar-day-header">화</div>
                <div class="calendar-day-header">수</div>
                <div class="calendar-day-header">목</div>
                <div class="calendar-day-header">금</div>
                <div class="calendar-day-header saturday">토</div>
            </div>
            <div id="calendar-body" class="calendar-grid" style="margin-top: 5px;"></div>
        </div>

        <!-- ================= [자산 섹션] ================= -->
        <div id="asset-section" style="display: none;">
            <h2 style="color: #1b5e20; text-align: center; margin-bottom: 25px;">현재 우리집 자산 기록하기</h2>
            
            <div class="form-group">
                <label>분류</label>
                <select id="asset-type">
                    <option value="bank">🏦 은행 (예금, 적금, 현금 등)</option>
                    <option value="invest">📈 투자 (주식, 펀드, 코인 등)</option>
                    <option value="credit">💳 신용카드 (카드대금 등)</option>
                </select>
            </div>
            <div class="form-group">
                <label>자산명 (어디에 있나요? / 어떤 카드인가요?)</label>
                <input type="text" id="asset-name" placeholder="예: 우리은행, 삼성전자, 현대카드">
            </div>
            <div class="form-group">
                <label>잔액 및 금액</label>
                <input type="number" id="asset-amount" placeholder="예: 0">
            </div>

            <div style="display: flex; gap: 10px;">
                <button id="saveAssetBtn" onclick="saveAssetData()" style="background-color: #1b5e20;">자산 추가하기</button>
                <button id="cancelAssetEditBtn" onclick="cancelAssetEdit()" style="display: none; background-color: #9e9e9e;">수정 취소</button>
            </div>

            <div id="asset-summary" style="background-color: #e8f5e9; padding: 25px 15px; border-radius: 8px; margin-top: 30px; text-align: center; border: 2px solid #c8e6c9;"></div>
            <h2 style="color: #2e7d32; margin-top: 30px; border-bottom: 2px solid #c8e6c9; padding-bottom: 10px; font-size: 18px;">자산 상세 목록</h2>
            <div id="asset-list"></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDDIfxfay3hphtjDCkR6tR5fH_ubup6BsY",
        authDomain: "myhousemoney-14c01.firebaseapp.com",
        projectId: "myhousemoney-14c01",
        storageBucket: "myhousemoney-14c01.firebasestorage.app",
        messagingSenderId: "208634328082",
        appId: "1:208634328082:web:a793e5d3fdd6838e1994cb"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let editingId = null;
    let allPayments = []; 
    let currentCategoryFilter = null; 
    let editingAssetId = null; 
    let allAssets = []; 
    let favoriteRoutes = []; 

    let currentCalYear = new Date().getFullYear();
    let currentCalMonth = new Date().getMonth();

    const today = new Date();
    document.getElementById('date').value = today.toISOString().substring(0, 10);
    document.getElementById('filter-month').value = today.toISOString().substring(0, 7);

    function showSection(section) {
        const tabs = ['ledger', 'calendar', 'asset'];
        tabs.forEach(t => {
            const btn = document.getElementById('btn-' + t);
            if (btn) { btn.style.backgroundColor = '#e8f5e9'; btn.style.color = '#2e7d32'; }
            document.getElementById(t + '-section').style.display = 'none';
        });
        const activeBtn = document.getElementById('btn-' + section);
        if (activeBtn) { activeBtn.style.backgroundColor = '#2e7d32'; activeBtn.style.color = 'white'; }
        document.getElementById(section + '-section').style.display = 'block';

        if (section === 'calendar') renderCalendar();
    }

    function login() {
        const email = document.getElementById('email').value;
        const pw = document.getElementById('pw').value;
        auth.signInWithEmailAndPassword(email, pw).then(() => {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
        }).catch((error) => { alert("비밀번호가 틀렸습니다!"); });
    }

    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            showSection('ledger'); 
        }
    });

    // ==========================================
    // [달력 렌더링 로직 - 더보기 기능 유지]
    // ==========================================
    function changeCalendarMonth(offset) {
        currentCalMonth += offset;
        if(currentCalMonth < 0) { currentCalMonth = 11; currentCalYear--; }
        else if(currentCalMonth > 11) { currentCalMonth = 0; currentCalYear++; }
        renderCalendar();
    }

    function createCalItemHtml(item) {
        let cls = ''; let prefix = '';
        if(item.type === 'income') { cls = 'cal-income'; prefix = '+'; }
        else if(item.type === 'expense') { cls = 'cal-expense'; prefix = '-'; }
        else { cls = 'cal-transfer'; prefix = '🔄'; }
        return `<div class="calendar-item ${cls}">
            <div style="font-weight:bold; margin-bottom:2px;">${item.merchant}</div>
            <div>${prefix}${Number(item.amount).toLocaleString()}원</div>
        </div>`;
    }

    window.toggleMore = function(hiddenId, btnId, count) {
        const hiddenDiv = document.getElementById(hiddenId);
        const btn = document.getElementById(btnId);
        if(hiddenDiv.style.display === 'none') {
            hiddenDiv.style.display = 'block';
            btn.innerText = '접기 ▴';
        } else {
            hiddenDiv.style.display = 'none';
            btn.innerText = '+' + count + ' 더보기 ▾';
        }
    };

    function renderCalendar() {
        const calBody = document.getElementById("calendar-body");
        if(!calBody) return;
        calBody.innerHTML = "";

        const monthTitle = document.getElementById("calendar-month-title");
        monthTitle.innerText = `${currentCalYear}년 ${currentCalMonth + 1}월`;

        const firstDay = new Date(currentCalYear, currentCalMonth, 1).getDay(); 
        const daysInMonth = new Date(currentCalYear, currentCalMonth + 1, 0).getDate(); 

        const paymentsByDate = {};
        allPayments.forEach(p => {
            if(!paymentsByDate[p.date]) paymentsByDate[p.date] = [];
            paymentsByDate[p.date].push(p);
        });

        for(let i=0; i<firstDay; i++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell empty';
            calBody.appendChild(cell);
        }

        for(let d=1; d<=daysInMonth; d++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell';
            
            let dayColor = '';
            const dayOfWeek = new Date(currentCalYear, currentCalMonth, d).getDay();
            if(dayOfWeek === 0) dayColor = 'sunday';
            if(dayOfWeek === 6) dayColor = 'saturday';

            const mm = String(currentCalMonth + 1).padStart(2, '0');
            const dd = String(d).padStart(2, '0');
            const dateStr = `${currentCalYear}-${mm}-${dd}`;
            
            let cellHtml = `<div class="calendar-date ${dayColor}">${d}</div>`;
            
            if(paymentsByDate[dateStr]) {
                const items = paymentsByDate[dateStr];
                
                const visibleItems = items.slice(0, 2);
                const hiddenItems = items.slice(2);
                
                visibleItems.forEach(item => { cellHtml += createCalItemHtml(item); });
                
                if(hiddenItems.length > 0) {
                    const hiddenId = `hidden-items-${dateStr}`;
                    const btnId = `btn-more-${dateStr}`;
                    
                    let hiddenHtml = `<div id="${hiddenId}" style="display:none; margin-top: 3px;">`;
                    hiddenItems.forEach(item => { hiddenHtml += createCalItemHtml(item); });
                    hiddenHtml += `</div>`;
                    
                    cellHtml += hiddenHtml;
                    cellHtml += `<div id="${btnId}" class="view-more-btn" onclick="toggleMore('${hiddenId}', '${btnId}', ${hiddenItems.length})">+${hiddenItems.length} 더보기 ▾</div>`;
                }
            }

            cell.innerHTML = cellHtml;
            calBody.appendChild(cell);
        }
    }

    // ==========================================
    // [가계부] 관련 코드
    // ==========================================
    function editData(id, date, merchant, amount, category, linkedAssetId) {
        editingId = id;
        document.getElementById('date').value = date;
        document.getElementById('merchant').value = merchant;
        document.getElementById('amount').value = amount;
        document.getElementById('category').value = category;
        if(linkedAssetId) document.getElementById('linked-asset').value = linkedAssetId;
        else document.getElementById('linked-asset').value = '';
        document.getElementById('input-buttons').style.display = "none";
        document.getElementById('edit-buttons').style.display = "flex";
        window.scrollTo(0, 0);
    }

    function cancelEdit() {
        editingId = null;
        document.getElementById('input-buttons').style.display = "flex";
        document.getElementById('edit-buttons').style.display = "none";
        document.getElementById('merchant').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('category').value = '';
        document.getElementById('linked-asset').value = '';
        document.getElementById('date').value = new Date().toISOString().substring(0, 10);
    }

    async function saveData(type) {
        const date = document.getElementById('date').value;
        const merchant = document.getElementById('merchant').value;
        const amount = document.getElementById('amount').value;
        const category = document.getElementById('category').value;
        const linkedAssetId = document.getElementById('linked-asset').value;
        const amountNum = Number(amount);

        if(!merchant || !amount) { alert("결제처와 금액을 적어주세요!"); return; }

        try {
            if (editingId) {
                const oldDoc = await db.collection("가계부결제내역").doc(editingId).get();
                const oldData = oldDoc.data();
                if (oldData.linkedAssetId) {
                    const oldAsset = allAssets.find(a => a.id === oldData.linkedAssetId);
                    if (oldAsset) {
                        let restoredAmt = oldAsset.amount;
                        if (oldData.type === 'income') restoredAmt -= Number(oldData.amount);
                        else if (oldData.type === 'expense') restoredAmt += Number(oldData.amount);
                        oldAsset.amount = restoredAmt; 
                        await db.collection("가계부자산목록").doc(oldData.linkedAssetId).update({ amount: restoredAmt });
                    }
                }
                if (linkedAssetId) {
                    const newAsset = allAssets.find(a => a.id === linkedAssetId);
                    if (newAsset) {
                        let newAmt = newAsset.amount;
                        if (type === 'income') newAmt += amountNum;
                        else if (type === 'expense') newAmt -= amountNum;
                        await db.collection("가계부자산목록").doc(linkedAssetId).update({ amount: newAmt });
                    }
                }
                await db.collection("가계부결제내역").doc(editingId).update({
                    date: date, merchant: merchant, amount: amountNum, category: category, type: type, linkedAssetId: linkedAssetId
                });
                alert("내역이 수정되고 자산 잔고가 업데이트되었습니다!");
                cancelEdit();
            } else {
                if (linkedAssetId) {
                    const targetAsset = allAssets.find(a => a.id === linkedAssetId);
                    if (targetAsset) {
                        let newAmount = targetAsset.amount;
                        if (type === 'income') newAmount += amountNum; 
                        else if (type === 'expense') newAmount -= amountNum; 
                        await db.collection("가계부자산목록").doc(linkedAssetId).update({ amount: newAmount });
                    }
                }
                await db.collection("가계부결제내역").add({
                    date: date, merchant: merchant, amount: amountNum, category: category, type: type, linkedAssetId: linkedAssetId,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert(linkedAssetId ? "자산 잔액이 자동으로 변경되고 내역이 저장되었습니다!" : "내역이 저장되었습니다!");
                cancelEdit();
            }
        } catch (error) { alert("처리 실패! " + error.message); }
    }

    async function saveFavoriteRoute() {
        const fromId = document.getElementById('transfer-from').value;
        const toId = document.getElementById('transfer-to').value;
        const memo = document.getElementById('transfer-memo').value;
        if(!fromId || !toId) { alert("출금 자산과 입금 자산을 먼저 선택해주세요!"); return; }
        if(fromId === toId) { alert("서로 다른 자산을 선택해주세요."); return; }
        try {
            await db.collection("가계부이체구간").add({ fromId: fromId, toId: toId, memo: memo || '', timestamp: Date.now() });
            alert("⭐ 자주 쓰는 이체 구간으로 저장되었습니다!");
        } catch (error) { alert("구간 저장 실패: " + error.message); }
    }

    db.collection("가계부이체구간").orderBy("timestamp", "asc").onSnapshot((snapshot) => {
        favoriteRoutes = [];
        snapshot.forEach(doc => { favoriteRoutes.push({ id: doc.id, ...doc.data() }); });
        renderFavoriteRoutes();
    });

    function renderFavoriteRoutes() {
        const container = document.getElementById('favorite-routes-container');
        if(!container) return;
        container.innerHTML = '';
        if(favoriteRoutes.length === 0) {
            container.innerHTML = '<span style="font-size: 12px; color: #999;">저장된 구간이 없습니다. 아래에서 자산을 선택하고 구간을 저장해보세요.</span>';
            return;
        }
        favoriteRoutes.forEach(route => {
            const fromAsset = allAssets.find(a => a.id === route.fromId);
            const toAsset = allAssets.find(a => a.id === route.toId);
            if(!fromAsset || !toAsset) return; 
            const btn = document.createElement('div');
            btn.style = "background: #e3f2fd; color: #1565c0; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; border: 1px solid #90caf9;";
            btn.innerHTML = `
                <span onclick="applyRoute('${route.fromId}', '${route.toId}', '${route.memo}')" style="font-weight: bold;">⭐ ${fromAsset.name} ➔ ${toAsset.name}</span>
                <span onclick="deleteRoute('${route.id}')" style="color: #d32f2f; font-weight: bold; padding-left: 5px; border-left: 1px solid #90caf9;">✕</span>
            `;
            container.appendChild(btn);
        });
    }

    function applyRoute(fromId, toId, memo) {
        document.getElementById('transfer-from').value = fromId;
        document.getElementById('transfer-to').value = toId;
        document.getElementById('transfer-memo').value = memo;
    }
    
    async function deleteRoute(id) {
        if(confirm("이 즐겨찾기 구간을 삭제하시겠습니까?")) await db.collection("가계부이체구간").doc(id).delete();
    }

    async function transferAsset() {
        const fromId = document.getElementById('transfer-from').value;
        const toId = document.getElementById('transfer-to').value;
        const amountStr = document.getElementById('transfer-amount').value;
        const memoStr = document.getElementById('transfer-memo').value;
        const amount = Number(amountStr);

        if(!fromId || !toId || !amountStr) { alert("출금/입금 자산 및 이체 금액을 입력해주세요!"); return; }
        if(fromId === toId) { alert("서로 다르게 선택해주세요."); return; }
        if(amount <= 0) { alert("금액은 0원보다 커야 합니다."); return; }

        const fromAsset = allAssets.find(a => a.id === fromId);
        const toAsset = allAssets.find(a => a.id === toId);

        try {
            await db.collection("가계부자산목록").doc(fromId).update({ amount: fromAsset.amount - amount });
            await db.collection("가계부자산목록").doc(toId).update({ amount: toAsset.amount + amount });
            await db.collection("가계부결제내역").add({
                date: document.getElementById('date').value, merchant: `${fromAsset.name} ➔ ${toAsset.name}`, amount: amount, category: "자산이체", type: 'transfer', fromAssetId: fromId, toAssetId: toId, memo: memoStr, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert(`✅ 이체 내역이 정상적으로 저장되었습니다!`);
            document.getElementById('transfer-amount').value = '';
            document.getElementById('transfer-from').value = '';
            document.getElementById('transfer-to').value = '';
            document.getElementById('transfer-memo').value = '';
        } catch (error) { alert("이체 중 오류 발생: " + error.message); }
    }

    function setCategoryFilter(category) {
        if (currentCategoryFilter === category) currentCategoryFilter = null; 
        else currentCategoryFilter = category;
        renderList();
    }

    function exportExcel() {
        try {
            const filterMonth = document.getElementById("filter-month").value;
            let csv = '날짜,구분,결제처,금액,항목,메모\n';
            let exportCount = 0;
            allPayments.forEach((data) => {
                if (filterMonth && !data.date.startsWith(filterMonth)) return;
                const catName = data.category || '기타';
                if (currentCategoryFilter && catName !== currentCategoryFilter) return;
                const typeStr = data.type === 'income' ? '수입' : (data.type === 'transfer' ? '이체' : '지출');
                const memoStr = data.memo || '';
                csv += `${data.date},${typeStr},${data.merchant},${data.amount},${catName},${memoStr}\n`;
                exportCount++;
            });
            if (exportCount === 0) { alert("저장할 결제 내역이 없습니다."); return; }
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            let fileName = filterMonth ? `우리집_가계부_${filterMonth}` : "우리집_가계부_전체";
            if (currentCategoryFilter) fileName += `_${currentCategoryFilter}`;
            link.download = fileName + ".csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        } catch (error) { alert("저장 중 오류가 발생했습니다."); }
    }

    db.collection("가계부결제내역").orderBy("date", "desc").onSnapshot((querySnapshot) => {
        allPayments = [];
        querySnapshot.forEach((doc) => { allPayments.push({ id: doc.id, ...doc.data() }); });
        renderList();
        renderCalendar(); 
    });

    function renderList() {
        const listContainer = document.getElementById("payment-list");
        const summaryBox = document.getElementById("summary-box");
        const filterMonth = document.getElementById("filter-month").value; 
        if (!listContainer || !summaryBox) return;
        
        listContainer.innerHTML = "";
        let totalExpense = 0; let totalIncome = 0; let expenseSums = {}; let incomeSums = {};
        
        allPayments.forEach((data) => {
            if (filterMonth && !data.date.startsWith(filterMonth)) return;
            const amountNum = Number(data.amount) || 0;
            const catName = data.category || '기타';
            if (data.type === 'expense') {
                totalExpense += amountNum;
                if (expenseSums[catName]) expenseSums[catName] += amountNum; else expenseSums[catName] = amountNum;
            } else if (data.type === 'income') {
                totalIncome += amountNum;
                if (incomeSums[catName]) incomeSums[catName] += amountNum; else incomeSums[catName] = amountNum;
            }
        });

        const displayMonth = filterMonth ? filterMonth.split('-')[1] + '월' : '전체';
        let summaryHTML = `<div style="font-size: 1.05em; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
            <div style="display:flex; flex-direction:column; gap:5px;"><span style="color: #1976d2;">📈 ${displayMonth} 수입: ${totalIncome.toLocaleString()}원</span><span style="color: #d32f2f;">📉 ${displayMonth} 지출: ${totalExpense.toLocaleString()}원</span></div>
            ${currentCategoryFilter ? `<button onclick="setCategoryFilter(null)" style="background: #bdbdbd; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; color: white; margin:0; width: auto;">필터 해제 ✕</button>` : ''}
        </div><div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">`;
        
        for (const [cat, sum] of Object.entries(incomeSums)) {
            const isSelected = currentCategoryFilter === cat;
            const bg = isSelected ? '#1976d2' : '#ffffff'; const color = isSelected ? '#ffffff' : '#1976d2'; const border = isSelected ? '#1976d2' : '#90caf9';
            summaryHTML += `<button onclick="setCategoryFilter('${cat}')" style="background: ${bg}; padding: 8px 10px; border-radius: 10px; border: 1px solid ${border}; font-size: 0.85em; color: ${color}; transition: 0.2s; margin:0; display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; word-break: keep-all;"><span>(수) ${cat}</span><strong>${sum.toLocaleString()}원</strong></button>`;
        }
        for (const [cat, sum] of Object.entries(expenseSums)) {
            const isSelected = currentCategoryFilter === cat;
            const bg = isSelected ? '#d32f2f' : '#ffffff'; const color = isSelected ? '#ffffff' : '#d32f2f'; const border = isSelected ? '#d32f2f' : '#ef9a9a';
            summaryHTML += `<button onclick="setCategoryFilter('${cat}')" style="background: ${bg}; padding: 8px 10px; border-radius: 10px; border: 1px solid ${border}; font-size: 0.85em; color: ${color}; transition: 0.2s; margin:0; display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; word-break: keep-all;"><span>(지) ${cat}</span><strong>${sum.toLocaleString()}원</strong></button>`;
        }
        summaryHTML += `</div>`;
        summaryBox.innerHTML = summaryHTML;

        allPayments.forEach((data) => {
            if (filterMonth && !data.date.startsWith(filterMonth)) return;
            const catName = data.category || '기타';
            if (currentCategoryFilter && catName !== currentCategoryFilter) return;

            const amountNum = Number(data.amount) || 0;
            let amountStr = ''; let typeTag = '';
            
            if (data.type === 'income') {
                amountStr = `<strong style="color: #1976d2;">+ ${amountNum.toLocaleString()}원</strong>`; typeTag = `<span style="background: #e3f2fd; color: #1976d2; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 5px;">수입</span>`;
            } else if (data.type === 'transfer') {
                amountStr = `<strong style="color: #757575;">${amountNum.toLocaleString()}원 이동</strong>`; typeTag = `<span style="background: #eeeeee; color: #757575; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 5px;">이체</span>`;
            } else { 
                amountStr = `<strong style="color: #d32f2f;">- ${amountNum.toLocaleString()}원</strong>`; typeTag = `<span style="background: #ffebee; color: #d32f2f; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 5px;">지출</span>`;
            }
            
            const memoHtml = data.memo ? `<div style="font-size: 0.85em; color: #757575; margin-top: 5px;">📝 메모: ${data.memo}</div>` : '';
            let linkedAssetStr = '';
            if (data.linkedAssetId) {
                const linkedAssetName = allAssets.find(a => a.id === data.linkedAssetId)?.name || '알 수 없음';
                linkedAssetStr = ` (🔗 ${linkedAssetName})`;
            }

            const listItem = document.createElement("div");
            listItem.style = "padding: 12px; border-bottom: 1px solid #e0e0e0; margin-bottom: 8px; background: #fafafa; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;";
            listItem.innerHTML = `
                <div style="flex: 1;">
                    <div style="font-size: 0.85em; color: #888; margin-bottom: 4px;">${data.date} ${typeTag}</div>
                    <div style="font-size: 1.05em; margin-bottom: 4px;"><strong>${data.merchant}</strong> - ${amountStr}</div>
                    <div style="font-size: 0.9em; color: #555;">[항목] ${catName}${linkedAssetStr}</div>
                    ${memoHtml}
                </div>
                <div style="display: flex; gap: 5px; flex-direction: column;">
                    ${data.type !== 'transfer' ? `<button onclick="editData('${data.id}', '${data.date}', \`${data.merchant}\`, ${amountNum}, \`${catName}\`, '${data.linkedAssetId || ''}')" style="width: auto; padding: 6px 12px; background-color: #f57c00; font-size: 12px; margin-top: 0; color: white; border: none; border-radius: 4px;">수정</button>` : ''}
                    <button onclick="deletePaymentItem('${data.id}')" style="width: auto; padding: 6px 12px; background-color: #d32f2f; font-size: 12px; margin-top: 0; color: white; border: none; border-radius: 4px;">삭제</button>
                </div>
            `;
            listContainer.appendChild(listItem);
        });
    }

    async function deletePaymentItem(id) {
        if (!confirm("이 내역을 삭제하시겠습니까? (연결된 자산 잔고도 원래대로 복구됩니다)")) return;
        try {
            const targetItem = allPayments.find(p => p.id === id);
            if (!targetItem) { await db.collection("가계부결제내역").doc(id).delete(); return; }
            const amt = Number(targetItem.amount) || 0;
            if (targetItem.type === 'transfer' && targetItem.fromAssetId && targetItem.toAssetId) {
                const fromAsset = allAssets.find(a => a.id === targetItem.fromAssetId);
                const toAsset = allAssets.find(a => a.id === targetItem.toAssetId);
                if (fromAsset) await db.collection("가계부자산목록").doc(fromAsset.id).update({ amount: fromAsset.amount + amt });
                if (toAsset) await db.collection("가계부자산목록").doc(toAsset.id).update({ amount: toAsset.amount - amt });
            } 
            else if (targetItem.linkedAssetId) {
                const targetAsset = allAssets.find(a => a.id === targetItem.linkedAssetId);
                if (targetAsset) {
                    let restoredAmount = targetAsset.amount;
                    if (targetItem.type === 'income') restoredAmount -= amt; 
                    else if (targetItem.type === 'expense') restoredAmount += amt; 
                    await db.collection("가계부자산목록").doc(targetItem.linkedAssetId).update({ amount: restoredAmount });
                }
            }
            await db.collection("가계부결제내역").doc(id).delete();
            alert("내역이 삭제되고 자산 잔고가 원복되었습니다.");
        } catch (error) { alert("삭제 중 오류 발생: " + error.message); }
    }

    // ==========================================
    // [자산] 관련 코드
    // ==========================================
    function editAssetData(id, type, name, amount) {
        editingAssetId = id; document.getElementById('asset-type').value = type; document.getElementById('asset-name').value = name; document.getElementById('asset-amount').value = amount;
        document.getElementById('saveAssetBtn').innerText = "수정 완료하기"; document.getElementById('saveAssetBtn').style.backgroundColor = "#f57c00"; document.getElementById('cancelAssetEditBtn').style.display = "block"; window.scrollTo(0, 0);
    }
    function cancelAssetEdit() {
        editingAssetId = null; document.getElementById('saveAssetBtn').innerText = "자산 추가하기"; document.getElementById('saveAssetBtn').style.backgroundColor = "#1b5e20"; document.getElementById('cancelAssetEditBtn').style.display = "none";
        document.getElementById('asset-name').value = ''; document.getElementById('asset-amount').value = '';
    }
    async function saveAssetData() {
        const type = document.getElementById('asset-type').value; const name = document.getElementById('asset-name').value; const amount = document.getElementById('asset-amount').value;
        if(!name || !amount) { alert("자산명과 금액을 적어주세요!"); return; }
        try {
            if (editingAssetId) { await db.collection("가계부자산목록").doc(editingAssetId).update({ type: type, name: name, amount: Number(amount) }); alert("자산이 수정되었습니다!"); cancelAssetEdit(); } 
            else { await db.collection("가계부자산목록").add({ type: type, name: name, amount: Number(amount), isFavorite: false, timestamp: Date.now() }); alert("새로운 자산이 추가되었습니다!"); document.getElementById('asset-name').value = ''; document.getElementById('asset-amount').value = ''; }
        } catch (error) { alert("자산 저장 실패! " + error.message); }
    }
    async function deleteAssetData(id) { if (confirm("이 자산을 삭제하시겠습니까?")) { await db.collection("가계부자산목록").doc(id).delete(); } }
    async function toggleFavorite(id, currentStatus) { try { await db.collection("가계부자산목록").doc(id).update({ isFavorite: !currentStatus }); } catch(error) { alert("즐겨찾기 설정 오류"); } }

    function updateAssetDropdowns() {
        const favAssets = allAssets.filter(a => a.isFavorite); const normalAssets = allAssets.filter(a => !a.isFavorite);
        let groupedHtml = '<option value="">선택 안 함 (가계부 내역만 기록)</option>';
        if(favAssets.length > 0) { groupedHtml += '<optgroup label="⭐ 즐겨찾는 자산">'; favAssets.forEach(asset => { groupedHtml += `<option value="${asset.id}">${asset.name} (${Number(asset.amount).toLocaleString()}원)</option>`; }); groupedHtml += '</optgroup>'; }
        if(normalAssets.length > 0) { groupedHtml += '<optgroup label="일반 자산">'; normalAssets.forEach(asset => { groupedHtml += `<option value="${asset.id}">${asset.name} (${Number(asset.amount).toLocaleString()}원)</option>`; }); groupedHtml += '</optgroup>'; }
        const linkedSelect = document.getElementById('linked-asset');
        if(linkedSelect) { const prevLinked = linkedSelect.value; linkedSelect.innerHTML = groupedHtml; if (prevLinked && allAssets.find(a => a.id === prevLinked)) linkedSelect.value = prevLinked; }

        let flatHtml = '<option value="">선택하세요</option>';
        allAssets.forEach(asset => { flatHtml += `<option value="${asset.id}">${asset.name} (${Number(asset.amount).toLocaleString()}원)</option>`; });
        const fromSelect = document.getElementById('transfer-from'); const toSelect = document.getElementById('transfer-to');
        if(fromSelect) { const prevFrom = fromSelect.value; fromSelect.innerHTML = flatHtml; if (prevFrom && allAssets.find(a => a.id === prevFrom)) fromSelect.value = prevFrom; }
        if(toSelect) { const prevTo = toSelect.value; toSelect.innerHTML = flatHtml; if (prevTo && allAssets.find(a => a.id === prevTo)) toSelect.value = prevTo; }
        renderFavoriteRoutes(); 
    }

    db.collection("가계부자산목록").orderBy("timestamp", "desc").onSnapshot((querySnapshot) => {
        allAssets = []; let bankTotal = 0; let investTotal = 0; let creditTotal = 0;
        querySnapshot.forEach((doc) => {
            const data = doc.data(); const amt = Number(data.amount) || 0; const isFav = data.isFavorite === true; 
            allAssets.push({ id: doc.id, type: data.type, name: data.name, amount: amt, isFavorite: isFav });
            if (data.type === 'bank') bankTotal += amt; else if (data.type === 'invest') investTotal += amt; else if (data.type === 'credit') creditTotal += amt;
        });

        updateAssetDropdowns();
        renderList(); 

        const assetSummary = document.getElementById("asset-summary"); const assetList = document.getElementById("asset-list");
        if (!assetSummary || !assetList) return;
        
        assetList.innerHTML = "";
        allAssets.forEach((data) => {
            let typeEmoji = '🏦 은행'; if (data.type === 'invest') typeEmoji = '📈 투자'; else if (data.type === 'credit') typeEmoji = '💳 신용카드';
            const amountColor = data.amount < 0 ? '#d32f2f' : (data.type === 'credit' ? '#d32f2f' : '#2e7d32');
            const listItem = document.createElement("div"); listItem.style = "padding: 12px; border-bottom: 1px solid #e0e0e0; margin-bottom: 8px; background: #fafafa; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;";
            listItem.innerHTML = `
                <div><div style="font-size: 0.85em; color: #888; margin-bottom: 4px;">[${typeEmoji}]</div><div style="font-size: 1.05em; margin-bottom: 4px;"><strong>${data.name}</strong></div><div style="font-size: 1em; font-weight: bold; color: ${amountColor};">${data.amount.toLocaleString()}원</div></div>
                <div style="display: flex; gap: 5px; flex-direction: column;">
                    <button onclick="toggleFavorite('${data.id}', ${data.isFavorite})" style="width: auto; padding: 6px 12px; background-color: ${data.isFavorite ? '#ffb300' : '#e0e0e0'}; font-size: 12px; margin-top: 0; color: ${data.isFavorite ? 'white' : '#757575'}; border: none; border-radius: 4px;">${data.isFavorite ? '⭐ 해제' : '☆ 즐겨찾기'}</button>
                    <div style="display: flex; gap: 5px;">
                        <button onclick="editAssetData('${data.id}', '${data.type}', \`${data.name}\`, ${data.amount})" style="width: auto; padding: 6px 12px; background-color: #f57c00; font-size: 12px; margin-top: 0; color: white; border: none; border-radius: 4px; flex: 1;">수정</button>
                        <button onclick="deleteAssetData('${data.id}')" style="width: auto; padding: 6px 12px; background-color: #d32f2f; font-size: 12px; margin-top: 0; color: white; border: none; border-radius: 4px; flex: 1;">삭제</button>
                    </div>
                </div>
            `;
            assetList.appendChild(listItem);
        });

        const total = bankTotal + investTotal + creditTotal;
        assetSummary.innerHTML = `
            <div style="font-size: 1.1em; color: #555; margin-bottom: 5px;">현재 총 자산</div>
            <div style="font-size: 2.2em; font-weight: bold; color: #1b5e20; margin-bottom: 25px;">${total.toLocaleString()}원</div>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                <div style="background: white; padding: 12px 8px; border-radius: 8px; border: 1px solid #c8e6c9;">
                    <div style="font-size: 0.85em; color: #666; margin-bottom: 5px;">🏦 은행 잔고</div><div style="font-size: 1.05em; font-weight: bold; color: ${bankTotal < 0 ? '#d32f2f' : '#2e7d32'}; word-break: break-all;">${bankTotal.toLocaleString()}원</div>
                </div>
                <div style="background: white; padding: 12px 8px; border-radius: 8px; border: 1px solid #c8e6c9;">
                    <div style="font-size: 0.85em; color: #666; margin-bottom: 5px;">📈 투자 금액</div><div style="font-size: 1.05em; font-weight: bold; color: ${investTotal < 0 ? '#d32f2f' : '#2e7d32'}; word-break: break-all;">${investTotal.toLocaleString()}원</div>
                </div>
                <div style="background: white; padding: 12px 8px; border-radius: 8px; border: 1px solid #ffcdd2;">
                    <div style="font-size: 0.85em; color: #666; margin-bottom: 5px;">💳 신용카드</div><div style="font-size: 1.05em; font-weight: bold; color: ${creditTotal < 0 ? '#d32f2f' : '#2e7d32'}; word-break: break-all;">${creditTotal.toLocaleString()}원</div>
                </div>
            </div>
        `;
    });
</script>
